# PRODUCTION — Docker Compose cho TAMI trên server dùng chung (ARCHITECTURE §6). Project `tami`, container `tami-*`, network riêng.
# KHÔNG chứa secret: mọi giá trị nhạy cảm đọc từ env file trên server (không commit), truyền bằng --env-file.
# Chỉ `app` publish cổng và chỉ bind 127.0.0.1:3010; postgres/redis/seaweedfs không publish cổng nào ra host.
#
# Dùng (trên server; TAMI_IMAGE = tag theo commit SHA, promote prod dùng đúng image đã chạy ở staging):
#   export TAMI_IMAGE=tami-web:<git-sha>
#   C="docker compose --env-file /opt/tami/prod.env -f docker/docker-compose.prod.yml"
#   $C config -q                                  # kiểm tra cấu hình + biến bắt buộc
#   $C build postgres backup                      # image postgres (+pgbackrest) và sidecar backup: một lần, hoặc khi đổi phiên bản trong docker/backup/Dockerfile
#   $C up -d postgres redis seaweedfs backup seaweedfs-init
#   $C --profile tools run --rm migrate           # BƯỚC RIÊNG trước khi bật app/jobs (app/jobs KHÔNG tự migrate lúc khởi động)
#   $C up -d app jobs
# Danh sách biến của env file: khối "Docker Compose staging/prod" trong .env.example (mục này dùng giá trị riêng của môi trường).
# Backup (pgBackRest + restic, kho ngoài server): BACKUP_ENV_DIR trỏ thư mục chứa pgbackrest.env, restic.env, ssh/ — xem docs/runbooks/restore.md.
#
# jobs: CHỈ 1 bản (job aggregate-click-stats cộng dồn đọc-rồi-ghi, không nguyên tử; ARCHITECTURE §6.2).
# Không dùng `--scale jobs=N`; container_name cố định cũng chặn việc này.
name: tami

x-logging: &default-logging
  # json-file có xoay vòng: Promtail/Alloy của hạ tầng Loki đọc log container qua docker (docker_sd); app log JSON (pino) ra stdout.
  # Không dùng driver loki trực tiếp vì cần plugin cài trên host dùng chung; thiếu plugin thì container không khởi động.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    labels: "com.docker.compose.project,com.docker.compose.service"

x-app-environment: &app-environment
  APP_ENV: production
  # Nguồn IP khách cho rate limit, BẮT BUỘC khai trong prod.env theo biến thể Nginx đang bật (thiếu thì mọi khách chung 1 bucket):
  #   không Cloudflare (tami-prod-direct.conf, Nginx ghi đè X-Real-IP): TRUST_CF_CONNECTING_IP=false, TRUST_X_REAL_IP=true
  #   sau Cloudflare (tami.conf, chỉ nhận IP Cloudflare):              TRUST_CF_CONNECTING_IP=true,  TRUST_X_REAL_IP=false
  TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:?TRUST_CF_CONNECTING_IP bắt buộc trong prod.env (xem runbook deploy §10)}
  TRUST_X_REAL_IP: ${TRUST_X_REAL_IP:?TRUST_X_REAL_IP bắt buộc trong prod.env (xem runbook deploy §10)}
  NODE_OPTIONS: "--max-old-space-size=768"
  DATABASE_URL: ${DATABASE_URL_PROD:?DATABASE_URL_PROD bắt buộc}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:?}
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:?}
  # Bước quét object mồ côi của job data-retention: mặc định CHỈ ĐẾM (dry-run). Chỉ đặt `delete` trong env file sau khi xác nhận bucket private chỉ phục vụ đúng DB này (restore.md §6 mục 6).
  RETENTION_ORPHAN_OBJECT_SCAN: ${RETENTION_ORPHAN_OBJECT_SCAN:-dry-run}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
  SMTP_HOST: ${SMTP_HOST:?}
  SMTP_USER: ${SMTP_USER:?}
  SMTP_PASS: ${SMTP_PASS:?}
  SMTP_PORT: ${SMTP_PORT:-587}
  # Tuỳ chọn: chuỗi rỗng làm validate email lỗi nên không đặt giá trị mặc định; thiếu trong env file thì không truyền.
  EMAIL_FROM_ADDRESS:
  EMAIL_ALLOWLIST: ${EMAIL_ALLOWLIST:-}   # production gửi email thật, biến này không có tác dụng
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
  TRANSLATION_MODEL: ${TRANSLATION_MODEL:?}
  TRANSLATION_MONTHLY_BUDGET_USD: ${TRANSLATION_MONTHLY_BUDGET_USD:?}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL bắt buộc (vd https://<domain>)}
  GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
  GLITCHTIP_PUBLIC_DSN: ${GLITCHTIP_PUBLIC_DSN:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # Job (container jobs) gọi app qua mạng Docker để làm mới cache trang (lib/revalidate/internal-revalidate.ts); Nginx chặn /api/internal/ ra ngoài.
  INTERNAL_APP_URL: http://app:3000
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  # Không đặt read_only: SWC của Next (nạp TS cho `jobs`/`migrate`) giải nén native addon vào ~/.cache cần ghi + exec; tmpfs mặc định noexec và
  # tính vào mem_limit. Rootfs ghi được là cache disk của container, mất khi tạo lại container (stateless).

services:
  app:
    image: ${TAMI_IMAGE:?TAMI_IMAGE bắt buộc (vd tami-web:<git-sha>)}
    container_name: tami-app
    <<: *hardening
    environment: *app-environment
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]
    # HEALTHCHECK /api/health nằm trong image.

  jobs:
    image: ${TAMI_IMAGE:?TAMI_IMAGE bắt buộc (vd tami-web:<git-sha>)}
    container_name: tami-jobs
    <<: *hardening
    # = `pnpm jobs` (payload run scripts/jobs-runner.ts) nhưng node chạy trực tiếp làm PID 1: qua pnpm, SIGTERM làm pnpm thoát ngay (exit 1)
    # trước khi runner kịp dừng êm; chạy trực tiếp thì runner log "đã dừng", exit 0.
    command: ["node", "node_modules/payload/bin.js", "run", "scripts/jobs-runner.ts"]
    environment:
      <<: *app-environment
      # Đo thực tế: ~190MB ổn định khi rảnh (payload + loader TS), nên heap 256MB trong mem_limit 384m.
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    # Worker chờ vòng đang chạy (tối đa 10 job SMTP) khi nhận SIGTERM.
    stop_grace_period: 60s
    # Không có HTTP: tắt HEALTHCHECK /api/health thừa kế từ image.
    healthcheck:
      disable: true
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  # Bước migrate riêng của pipeline deploy (profile `tools`: không chạy khi `up`).
  migrate:
    image: ${TAMI_IMAGE:?TAMI_IMAGE bắt buộc (vd tami-web:<git-sha>)}
    container_name: tami-migrate
    profiles: ["tools"]
    <<: *hardening
    command: ["node", "node_modules/payload/bin.js", "migrate"]
    environment: *app-environment
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      disable: true
    mem_limit: 512m
    restart: "no"
    logging: *default-logging
    networks: [internal]

  postgres:
    # Image tuỳ biến (docker/backup/Dockerfile target postgres) = postgres:17.11-bookworm + PostGIS 3.5.2 + pgbackrest (archive_command cần binary
    # trong container). Dựng 1 lần: `$C build postgres backup` (deploy.sh không pull image này; chưa có tag thì `compose up` tự build).
    # Đổi tag = đổi image trên volume `postgres-data` đang có dữ liệu: deploy.sh TỪ CHỐI khi container postgres đang chạy image khác tag này;
    # chuyển image (bullseye -> bookworm: đổi glibc/collation, phải REINDEX) theo docs/runbooks/postgres-base-image.md.
    image: tami-postgres:17-3.5-bookworm-pgbackrest2.59
    build:
      context: ./backup
      target: postgres
    container_name: tami-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-tami}
      PGBACKREST_PG1_USER: ${POSTGRES_USER:-tami}
      # Trần WAL chưa lên kho (pgbackrest.conf giải thích): vượt thì BỎ WAL thay vì làm đầy ổ server dùng chung. Staging 4GiB / prod 8GiB (ước tính runbook ~4,6 GB WAL/ngày ở tải cao: kho chết quá cỡ 1-2 ngày thì mới bỏ WAL).
      PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX: ${BACKUP_ARCHIVE_PUSH_QUEUE_MAX:-8GiB}
    # Kho đích + khoá + mật khẩu mã hoá của pgBackRest (PGBACKREST_REPO1_*): file trên server, KHÔNG commit (mẫu docker/backup/pgbackrest-env.example).
    env_file:
      - ${BACKUP_ENV_DIR:?BACKUP_ENV_DIR bắt buộc (thư mục chứa pgbackrest.env, restic.env, ssh/; xem docs/runbooks/restore.md)}/pgbackrest.env
    # `DATABASE_URL_PROD` phải trỏ tới host `postgres`, cùng user/mật khẩu/db ở trên.
    # archive_timeout 300s: WAL đang ghi dở được đẩy lên kho tối đa mỗi 5 phút => RPO <= 15 phút kể cả khi một lần đẩy lỗi/chậm.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=100
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=tami archive-push %p
      - -c
      - archive_timeout=300
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # Thư mục socket dùng chung với sidecar `backup` (pgBackRest backup nối vào postgres qua unix socket).
      - postgres-socket:/var/run/postgresql
      - ${BACKUP_ENV_DIR}/ssh:/etc/backup/ssh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  # Sidecar backup (ARCHITECTURE §8): lịch + chạy pgBackRest (diff/full/check) và restic. Chạy user postgres (uid 999) để đọc pgdata (read-only).
  # Kho đích nằm NGOÀI server (cấu hình bằng env file). Chỉ một bản; không publish cổng. Runbook: docs/runbooks/restore.md.
  backup:
    image: tami-backup:bookworm-pgbackrest2.59-restic0.17.3
    build:
      context: ./backup
      target: backup
    container_name: tami-backup
    <<: *hardening
    user: "999:999"
    entrypoint: ["bash", "/opt/backup/scheduler.sh"]
    env_file:
      - ${BACKUP_ENV_DIR:?BACKUP_ENV_DIR bắt buộc}/pgbackrest.env
      - ${BACKUP_ENV_DIR}/restic.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      BACKUP_ENV_NAME: production
      PGBACKREST_PG1_USER: ${POSTGRES_USER:-tami}
      SRC_S3_ENDPOINT: http://seaweedfs:8333
      SRC_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      SRC_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      SRC_S3_BUCKETS: ${S3_BUCKET_PUBLIC:?} ${S3_BUCKET_PRIVATE:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - postgres-socket:/var/run/postgresql
      - ./backup:/opt/backup:ro
      - ./backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - backup-state:/var/lib/tami-backup
      - backup-mirror:/mirror
      - ${BACKUP_ENV_DIR}/ssh:/etc/backup/ssh:ro
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    stop_grace_period: 30s
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: tami-redis
    # Mật khẩu qua env (không nằm trong process list của host). volatile-lru: chỉ đẩy key có TTL khi đầy bộ nhớ.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 100mb --maxmemory-policy volatile-lru --save 300 10"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: tami-seaweedfs
    # master + volume + filer + S3 gateway trong một tiến trình. Khoá S3 lấy từ AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (không có file cấu hình chứa secret).
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0", "-volume.max=30", "-master.volumeSizeLimitMB=1024"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  # Tạo 2 bucket nếu chưa có (idempotent): chỉ bỏ qua lỗi "already exists"; lỗi khác (sai tên/khoá) làm init exit 1.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    container_name: tami-seaweedfs-init
    depends_on:
      seaweedfs: { condition: service_healthy }
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for bucket in "$$S3_BUCKET_PUBLIC" "$$S3_BUCKET_PRIVATE"; do
          if ! out=$$(echo "s3.bucket.create -name $$bucket" | weed shell -master=seaweedfs:9333 2>&1); then
            case "$$out" in
              *"already exists"*) echo "bucket $$bucket đã tồn tại" ;;
              *) echo "$$out" >&2; exit 1 ;;
            esac
          fi
        done
    environment:
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:?}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:?}
    mem_limit: 128m
    logging: *default-logging
    networks: [internal]

networks:
  internal:
    name: tami-net

volumes:
  postgres-data:
  postgres-socket:
  backup-state:
  backup-mirror:
  redis-data:
  seaweedfs-data:
