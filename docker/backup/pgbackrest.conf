# pgBackRest cho TAMI — mount vào /etc/pgbackrest/pgbackrest.conf (postgres + sidecar backup).
# Chỉ chứa phần tĩnh. Kho đích + mật khẩu mã hoá + khoá S3/SFTP đến từ biến môi trường PGBACKREST_REPO1_* trong
# env file trên server (mẫu: pgbackrest-env.example); KHÔNG ghi secret vào file này.
[global]
log-level-console=info
# Không ghi file log (postgres chạy user postgres, không có thư mục log ghi được): log đi stdout/stderr -> docker logs -> Loki.
log-level-file=off
start-fast=y
compress-type=zst
compress-level=3
process-max=2

# Giữ: full hằng tuần (lịch trong scheduler.sh) x 6 bản >= 35 ngày => khôi phục PITR được tới bất kỳ thời điểm nào trong 30 ngày.
# Dùng "count" thay vì "time": kiểu time làm cửa sổ PITR co lại < 30 ngày ngay sau khi bản full cũ nhất hết hạn.
repo1-retention-full-type=count
repo1-retention-full=6
repo1-retention-diff=14
# WAL giữ đủ cho 6 bản full gần nhất (mặc định bằng retention-full; ghi tường minh để không ai vô tình hạ cửa sổ PITR).
repo1-retention-archive-type=full
repo1-retention-archive=6

# Trần hàng đợi WAL chưa lên kho: đặt qua env PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX trong docker-compose (staging 4GiB, prod 8GiB; đổi bằng BACKUP_ARCHIVE_PUSH_QUEUE_MAX).
# Kho đích chết (khoá hết hạn, B2 lỗi, sai env) thì PostgreSQL giữ mọi WAL trong pg_wal tới khi đầy ổ => sập postgres VÀ các dự án khác trên server dùng chung.
# Vượt trần: pgBackRest báo "đã lưu" rồi BỎ WAL (cảnh báo trong log postgres) => DB sống nhưng chuỗi WAL gãy, PITR không đi qua khoảng đó
# cho tới khi có bản full MỚI (runbook restore.md §9). Chấp nhận mất PITR còn hơn mất DB. Chế độ đồng bộ (mặc định) vẫn áp dụng trần này.

[tami]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
# pg1-user lấy từ PGBACKREST_PG1_USER (= POSTGRES_USER; image không tạo role "postgres" khi POSTGRES_USER khác).
