# CHỈ DÙNG CHO TEST (docker/backup/test/e2e.sh): thêm hai đích backup tạm vào project compose PROD (stack có backup duy nhất; đổi tên container/network tami-* -> tami-bk-e2e-* vì trùng container dev)
# (`-f docker/docker-compose.prod.yml -f docker/backup/test/docker-compose.e2e.yml -p tami-bk-e2e`).
#   target-s3   : SeaweedFS S3 qua HTTPS (chứng chỉ tự ký) — mô phỏng B2/MinIO/SeaweedFS của công ty
#   target-sftp : OpenSSH SFTP — mô phỏng server khác của công ty
services:
  target-s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.port.https=8334", "-s3.cert.file=/certs/cert.pem", "-s3.key.file=/certs/key.pem", "-ip.bind=0.0.0.0", "-volume.max=60", "-master.volumeSizeLimitMB=256"]
    environment:
      AWS_ACCESS_KEY_ID: ${E2E_TARGET_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${E2E_TARGET_SECRET:?}
    volumes:
      - ${E2E_DIR:?}/certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  target-sftp:
    image: atmoz/sftp:alpine
    # libssh2 1.10.0 của Debian 12 (link OpenSSL) trong pgbackrest 2.59: đàm phán được kex curve25519/ecdh và host key ed25519/ecdsa (đã thử: sshd
    # chỉ cho curve25519 vẫn chạy), nhưng khoá NGƯỜI DÙNG RSA vẫn ký ssh-rsa (SHA-1; rsa-sha2-* chỉ có từ libssh2 1.11). OpenSSH >= 8.8 tắt
    # ssh-rsa mặc định nên server SFTP phải bật lại đúng 1 dòng PubkeyAcceptedAlgorithms (xem runbook §9). Không còn cần +diffie-hellman / HostKeyAlgorithms +ssh-rsa.
    entrypoint: ["sh", "-c", "printf 'PubkeyAcceptedAlgorithms +ssh-rsa\n' >> /etc/ssh/sshd_config && exec /entrypoint tami::1001:1001:upload"]
    volumes:
      - ${E2E_DIR:?}/ssh/id_rsa.pub:/home/tami/.ssh/keys/id_rsa.pub:ro
    networks: [internal]

  # Tên container cố định của prod (tami-*) trùng container dev: đổi sang tami-bk-e2e-*.
  app:
    container_name: tami-bk-e2e-app
  jobs:
    container_name: tami-bk-e2e-jobs
  migrate:
    container_name: tami-bk-e2e-migrate
  postgres:
    container_name: tami-bk-e2e-postgres
  redis:
    container_name: tami-bk-e2e-redis
  seaweedfs:
    container_name: tami-bk-e2e-seaweedfs
  seaweedfs-init:
    container_name: tami-bk-e2e-seaweedfs-init

  # Lịch của sidecar để rảnh trong lúc test (test tự gọi script; scheduler được thử riêng với state tạm).
  backup:
    container_name: tami-bk-e2e-backup
    environment:
      BACKUP_WAL_CHECK_SECONDS: "86400"
      BACKUP_PG_SLOT: "2359"
      BACKUP_FILES_SLOT: "2359"
      BACKUP_CHECK_SLOT: "2359"

networks:
  internal:
    name: tami-bk-e2e-net
