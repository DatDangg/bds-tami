# Tên miền production CŨ tami.genieplatform.cloud (server cũ 187.52.119.50, nginx 1.24) -> 301 sang https://tamihomes.vn (BL-112, sau cắt chuyển).
# THAY `tami-prod-direct.conf` trong sites-enabled/ trên SERVER CŨ (giữ bản sao trong sites-available để rollback: gỡ symlink cũ, thêm symlink file này).
# Chỉ cổng 443; cổng 80 giữ nguyên `tami-prod-direct-http.conf` (ACME gia hạn cert cũ vẫn chạy, và 80 -> https -> 301 tiếp).
# Cert cũ /etc/letsencrypt/live/tami.genieplatform.cloud/ giữ nguyên (cert này còn SAN sslip của staging cũ nên vẫn phải gia hạn).
# KHÔNG cài lên server mới. KHÔNG thêm `http2` vào listen: nginx 1.24 coi `http2` là thuộc tính SOCKET, bật sẽ ảnh hưởng mọi site khác trên 443.
# Không `default_server`, không lặp `ipv6only=on`. Quy trình: nginx -t -> systemctl reload nginx (KHÔNG restart).
# Không định nghĩa log_format/upstream và không phụ thuộc cái nào (`tami_direct`/`tami_app` biến mất cùng file bị thay) -> không access log, tránh lưu thêm IP/URL.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tami.genieplatform.cloud;

    access_log off;
    error_log  /var/log/nginx/tami.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/tami.genieplatform.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tami.genieplatform.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Giữ HSTS cũ (trình duyệt đã ghi nhớ HTTPS cho tên miền này).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Giữ path + query; 301 vĩnh viễn để công cụ tìm kiếm chuyển tín hiệu sang tên miền mới.
    return 301 https://tamihomes.vn$request_uri;
}
