# Production mới: tamihomes.vn (server 179.197.242.57, KHÔNG Cloudflare/CDN/Tunnel) — site cổng 80: thử thách ACME HTTP-01 của certbot + chuyển hướng sang HTTPS apex.
# Cài thành /etc/nginx/sites-available/tami-prod-tamihomes-http.conf + symlink sites-enabled/ TRƯỚC khi xin chứng chỉ
# (file 443 `tami-prod-tamihomes.conf` chỉ cài SAU khi certbot đã cấp chứng chỉ và app chạy, vì nginx -t lỗi nếu thiếu file cert).
# Chỉ khớp đúng 2 server_name này (KHÔNG default_server; site `default` của gói nginx giữ cổng 80). Quy trình: docs/runbooks/deploy.md §12.
# Thư mục webroot dùng chung với staging: /var/www/certbot.

server {
    listen 80;
    listen [::]:80;
    server_name tamihomes.vn www.tamihomes.vn;

    # Không ghi access log: chỉ ACME + chuyển hướng (và tránh phụ thuộc log_format định nghĩa ở file 443).
    access_log off;
    error_log  /var/log/nginx/tami-prod.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Mọi host (apex lẫn www) về apex https, giữ path + query.
    location / {
        return 301 https://tamihomes.vn$request_uri;
    }
}
