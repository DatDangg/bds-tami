# SERVER CŨ 187.52.119.50 — DỰ PHÒNG chạy song song tới khi user tắt. Staging chính nay ở server mới: tami-staging-sslip-179*.conf (docs/runbooks/deploy.md §11).
# Staging trên sslip.io (KHÔNG Cloudflare) — site cổng 80: thử thách ACME HTTP-01 của certbot + chuyển hướng sang HTTPS.
# Cài thành /etc/nginx/sites-available/tami-staging-sslip-http.conf + symlink sites-enabled/ TRƯỚC khi xin chứng chỉ
# (file 443 `tami-staging-sslip.conf` chỉ cài SAU khi certbot đã cấp chứng chỉ, vì nginx -t lỗi nếu thiếu file cert).
# Chỉ khớp đúng server_name này (KHÔNG default_server; site default đã giữ cổng 80) nên không ảnh hưởng site khác trên host dùng chung. KHÔNG sửa file của site khác.
# Thư mục webroot: sudo install -d -o root -g root -m 755 /var/www/certbot

server {
    listen 80;
    listen [::]:80;
    server_name 187-52-119-50.sslip.io;

    # Không ghi access log: chỉ ACME + chuyển hướng (và tránh phụ thuộc log_format định nghĩa ở file 443).
    access_log off;
    error_log  /var/log/nginx/tami-staging.error.log warn;

    # Không basic auth ở đây: certbot (Let's Encrypt) phải đọc được thử thách.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
