# Production KHÔNG Cloudflare (quyết định user 2026-10-23: domain tami.genieplatform.cloud trỏ DNS A thẳng về server, chưa dùng Cloudflare)
# — site cổng 443 của TAMI trên host dùng chung. Cài thành /etc/nginx/sites-available/tami-prod-direct.conf + symlink sites-enabled/ (runbook deploy §10).
# Quy trình: nginx -t -> systemctl reload nginx (KHÔNG restart). KHÔNG sửa file của site khác.
# Dùng THAY cho tami.conf (biến thể Cloudflare) trên cùng cổng 3010; không bật cả hai cho cùng server_name.
# Không dùng `include snippets/tami-cloudflare-ips.conf`: không có Cloudflare, $remote_addr đã là IP khách thật.
# Chứng chỉ Let's Encrypt (certbot --webroot, --cert-name tami.genieplatform.cloud) tại /etc/letsencrypt/live/tami.genieplatform.cloud/ ;
# hook reload nginx gắn riêng cho chứng chỉ này (`certonly --deploy-hook`, runbook §9.2), không dùng renewal-hooks/deploy dùng chung.
# `app` env phải có TRUST_CF_CONNECTING_IP=false + TRUST_X_REAL_IP=true (đặt trong /opt/tami/prod.env, compose prod bắt buộc khai).

# Log kèm IP khách thật ($remote_addr). Không log query string (có thể chứa PII).
log_format tami_direct '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent" rt=$request_time';

upstream tami_app {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    # KHÔNG thêm `http2` vào listen: host dùng chung chạy nginx 1.24, ở đó tham số `http2` thuộc về SOCKET (địa chỉ:cổng) chứ không thuộc từng server,
    # nên bật ở đây sẽ bật HTTP/2 cho MỌI site khác trên 443. Cũng KHÔNG đặt `default_server` và KHÔNG lặp `ipv6only=on` (xem tami-staging-sslip.conf).
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tami.genieplatform.cloud;

    access_log /var/log/nginx/tami.access.log tami_direct;
    error_log  /var/log/nginx/tami.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/tami.genieplatform.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tami.genieplatform.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Header bảo mật mức host. Các location bên dưới KHÔNG dùng add_header để các header này (và Cache-Control của app) được giữ nguyên.
    # CSP do app quản lý (chưa cấu hình ở task này).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload tối đa 20MB (src/lib/upload/validate-file.ts) + phần multipart.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # IP khách cho rate limit: app (TRUST_X_REAL_IP=true) chỉ đọc X-Real-IP. Nginx LUÔN ghi đè bằng $remote_addr (giá trị client gửi bị bỏ);
    # app chỉ tới được qua 127.0.0.1:3010 nên không ai bỏ qua Nginx để tự đặt header này.
    proxy_set_header X-Real-IP $remote_addr;
    # Không có Cloudflare: xoá CF-Connecting-IP do client gửi (app đặt TRUST_CF_CONNECTING_IP=false nên cũng không tin, đây là lớp thứ hai).
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 60s;

    # Prometheus scrape thẳng 127.0.0.1:3010 (kèm Bearer METRICS_TOKEN), không public.
    location = /api/metrics {
        return 404;
    }

    # Route nội bộ cho job làm mới cache (INTERNAL_APP_URL trong mạng Docker, Bearer dẫn xuất từ PAYLOAD_SECRET), không public.
    location ^~ /api/internal/ {
        return 404;
    }

    # Ảnh media: giữ nguyên `Cache-Control: public, max-age=31536000, immutable` của app (không strip/ghi đè, không proxy_cache).
    location ^~ /api/media/file/ {
        proxy_cache off;
        proxy_pass http://tami_app;
    }

    # Admin + API: không cache ở nginx; Cache-Control do app quyết định (no-store, riêng /api/monitoring-config là private).
    location ^~ /admin {
        proxy_cache off;
        proxy_pass http://tami_app;
    }
    location ^~ /api/ {
        proxy_cache off;
        proxy_pass http://tami_app;
    }

    location / {
        proxy_cache off;
        proxy_pass http://tami_app;
    }
}
