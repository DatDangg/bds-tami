# Staging trên sslip.io (KHÔNG Cloudflare, KHÔNG CDN) — site cổng 443 của TAMI trên host dùng chung.
# Cài thành /etc/nginx/sites-available/tami-staging-sslip.conf + symlink sites-enabled/ SAU khi certbot đã cấp chứng chỉ
# (xem docs/runbooks/deploy.md § "Staging trên sslip.io"). Quy trình: nginx -t -> systemctl reload nginx. KHÔNG sửa file của site khác.
# Dùng THAY cho tami-staging.conf (biến thể Cloudflare) trên cùng cổng 3011; không bật cả hai cho cùng server_name.
# Không dùng `include snippets/tami-cloudflare-ips.conf`: không có Cloudflare, $remote_addr đã là IP khách thật.
# Truy cập: HTTP basic auth (file htpasswd tạo trên server, KHÔNG commit):
#   sudo htpasswd -c /etc/nginx/tami-staging.htpasswd <user>   (cần apache2-utils)
# Chứng chỉ Let's Encrypt (certbot --webroot) (--cert-name tami.genieplatform.cloud, SAN gồm tami.genieplatform.cloud + sslip; DÙNG CHUNG với tami-prod-direct.conf, gia hạn cần cả hai site cổng 80 phục vụ /.well-known/acme-challenge/) nằm ở /etc/letsencrypt/live/tami.genieplatform.cloud/ ; certbot tự gia hạn; hook reload nginx gắn RIÊNG cho chứng chỉ này qua `certonly --deploy-hook` (runbook §9.2), không dùng renewal-hooks/deploy dùng chung.
# HSTS cố ý ngắn (1 ngày, không includeSubDomains/preload): hostname sslip.io tạm thời, tránh khoá trình duyệt nếu phải đổi sang chứng chỉ tự ký.
# Ở bước bootstrap, `app` env phải có TRUST_CF_CONNECTING_IP=false + TRUST_X_REAL_IP=true (mặc định của docker-compose.staging.yml).

# Log kèm IP khách thật ($remote_addr). Không log query string (có thể chứa PII).
log_format tami_staging_sslip '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent" rt=$request_time';

upstream tami_staging_app {
    server 127.0.0.1:3011;
    keepalive 16;
}

server {
    # KHÔNG thêm `http2` vào listen: host dùng chung chạy nginx 1.24, ở đó tham số `http2` thuộc về SOCKET (địa chỉ:cổng) chứ không thuộc từng server,
    # nên bật ở đây sẽ bật HTTP/2 cho MỌI site khác trên 443 (crm-dhp, nta, nhstar, tmfoods...). Các site hiện tại đều chỉ `listen 443 ssl;`. HTTP/1.1 là đủ cho staging.
    # Cũng KHÔNG đặt `default_server` và KHÔNG lặp `ipv6only=on` (một site khác đã đặt cho [::]:443; lặp lại thì nginx -t báo "duplicate listen options").
    listen 443 ssl;
    listen [::]:443 ssl;
    # tami.genieplatform.cloud gắn tạm cho staging 2026-10-21, chuyển sang production 2026-10-23 (tami-prod-direct.conf); staging chỉ còn sslip.
    server_name 187-52-119-50.sslip.io;

    access_log /var/log/nginx/tami-staging.access.log tami_staging_sslip;
    error_log  /var/log/nginx/tami-staging.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/tami.genieplatform.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tami.genieplatform.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Basic auth tắt 2026-10-19 theo yêu cầu user (staging mở công khai, vẫn noindex). Bật lại: bỏ comment 2 dòng dưới.
    # auth_basic "TAMI staging";
    # auth_basic_user_file /etc/nginx/tami-staging.htpasswd;
    # Không chuyển thông tin đăng nhập basic auth xuống app (Payload cũng đọc header Authorization).
    proxy_set_header Authorization "";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Header bảo mật mức host. Các location bên dưới KHÔNG dùng add_header (kế thừa các header này), TRỪ `/api/media/file/` (phải lặp lại, xem ở đó).
    # CSP do app quản lý (chưa cấu hình ở task này).
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload tối đa 20MB (src/lib/upload/validate-file.ts) + phần multipart.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # IP khách cho rate limit: app (TRUST_X_REAL_IP=true) chỉ đọc X-Real-IP. Nginx LUÔN ghi đè bằng $remote_addr (giá trị client gửi bị bỏ);
    # app chỉ tới được qua 127.0.0.1:3011 nên không ai bỏ qua Nginx để tự đặt header này.
    proxy_set_header X-Real-IP $remote_addr;
    # Không có Cloudflare: xoá CF-Connecting-IP do client gửi (app đặt TRUST_CF_CONNECTING_IP=false nên cũng không tin, đây là lớp thứ hai).
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 60s;

    # Prometheus scrape thẳng 127.0.0.1:3011 (kèm Bearer METRICS_TOKEN), không public.
    location = /api/metrics {
        return 404;
    }

    # Route nội bộ cho job làm mới cache (INTERNAL_APP_URL trong mạng Docker, Bearer dẫn xuất từ PAYLOAD_SECRET), không public.
    location ^~ /api/internal/ {
        return 404;
    }

    # Ảnh media: app trả `public, max-age=86400, immutable`. Ở STAGING ghi đè thành private, no-store (không CDN nhưng trình duyệt/proxy
    # trung gian không được giữ ảnh dự án chưa công bố). Prod giữ header của app.
    # `add_header` trong location làm mất kế thừa add_header mức server -> LẶP LẠI X-Robots-Tag + header bảo mật
    # (khi sửa các header mức server ở trên phải sửa cả khối này).
    location ^~ /api/media/file/ {
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://tami_staging_app;
    }

    # Admin + API: không cache ở nginx; Cache-Control do app quyết định (no-store, riêng /api/monitoring-config là private).
    location ^~ /admin {
        proxy_cache off;
        proxy_pass http://tami_staging_app;
    }
    location ^~ /api/ {
        proxy_cache off;
        proxy_pass http://tami_staging_app;
    }

    location / {
        proxy_cache off;
        proxy_pass http://tami_staging_app;
    }
}
