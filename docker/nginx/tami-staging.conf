# Staging — site nginx cho TAMI trên host dùng chung. Cài thành /etc/nginx/sites-available/tami-staging.conf + symlink sites-enabled/.
# Quy trình: sửa REPLACE_WITH_* -> `nginx -t` -> `nginx -s reload`. KHÔNG sửa file của site khác.
# Cần có trước: snippets/tami-cloudflare-ips.conf, chứng chỉ origin Cloudflare (Full strict).
# Staging: chặn truy cập công khai bằng HTTP basic auth (file htpasswd tạo trên server, KHÔNG commit):
#   htpasswd -c /etc/nginx/tami-staging.htpasswd <user>   (hoặc đặt Cloudflare Access trước host này và có thể bỏ auth_basic)

# Log kèm IP khách thật (từ Cloudflare) vì $remote_addr là IP edge Cloudflare. Không log query string (có thể chứa PII).
log_format tami_staging '$http_cf_connecting_ip $remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent" rt=$request_time';

upstream tami_staging_app {
    server 127.0.0.1:3011;
    keepalive 16;
}

# Không mở cổng 80: Cloudflare Full (strict) kết nối HTTPS tới origin, chuyển HTTP->HTTPS đặt ở Cloudflare (Always Use HTTPS).
# (Không thể gate cổng 80 bằng allow/deny khi chỉ có `return 301`: return chạy ở pha rewrite, trước pha access.)

server {
    # `http2` trong listen chạy được trên mọi bản nginx (Ubuntu 22.04 = 1.18, 24.04 = 1.24); `http2 on;` cần >= 1.25.1.
    # Bản >= 1.25.1 chỉ cảnh báo "deprecated" (không lỗi); khi host lên bản mới có thể đổi sang `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.REPLACE_WITH_PRODUCTION_DOMAIN;

    access_log /var/log/nginx/tami-staging.access.log tami_staging;
    error_log  /var/log/nginx/tami-staging.error.log warn;

    ssl_certificate     /etc/ssl/tami/origin.pem;
    ssl_certificate_key /etc/ssl/tami/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Authenticated Origin Pulls (mTLS) — bật khi user duyệt; tải CA từ Cloudflare về /etc/ssl/tami/cloudflare-origin-pull-ca.pem:
    # ssl_client_certificate /etc/ssl/tami/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    include snippets/tami-cloudflare-ips.conf;

    auth_basic "TAMI staging";
    auth_basic_user_file /etc/nginx/tami-staging.htpasswd;
    # Không chuyển thông tin đăng nhập basic auth xuống app (Payload cũng đọc header Authorization).
    proxy_set_header Authorization "";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Header bảo mật mức host. Các location bên dưới KHÔNG dùng add_header (kế thừa các header này), TRỪ `/api/media/file/` (phải lặp lại, xem ở đó).
    # CSP do app quản lý (chưa cấu hình ở task này).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload tối đa 20MB (src/lib/upload/validate-file.ts) + phần multipart.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Giữ nguyên IP khách do Cloudflare đặt. Chỉ tới được đây khi peer là IP Cloudflare (allow/deny ở trên); Cloudflare luôn ghi đè header này.
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 60s;

    # Prometheus scrape thẳng 127.0.0.1:3011 (kèm Bearer METRICS_TOKEN), không public.
    location = /api/metrics {
        return 404;
    }

    # Ảnh media (G1: app trả `public, max-age=31536000, immutable`). Ở STAGING phải ghi đè thành private, no-store:
    # nếu không, Cloudflare cache ảnh (kể cả response của request có basic auth, vì `public`) rồi phát cho người
    # chưa qua basic auth -> lộ ảnh dự án chưa công bố. Prod giữ header của app (ảnh public là chủ đích).
    # `add_header` trong location làm mất kế thừa add_header mức server -> LẶP LẠI X-Robots-Tag + header bảo mật
    # (khi sửa các header mức server ở trên phải sửa cả khối này).
    location ^~ /api/media/file/ {
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://tami_staging_app;
    }

    # Admin + API: không cache ở nginx; Cache-Control do app quyết định (no-store, riêng /api/monitoring-config là private).
    location ^~ /admin {
        proxy_cache off;
        proxy_pass http://tami_staging_app;
    }
    location ^~ /api/ {
        proxy_cache off;
        proxy_pass http://tami_staging_app;
    }

    location / {
        proxy_cache off;
        proxy_pass http://tami_staging_app;
    }
}
