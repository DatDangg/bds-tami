# Chỉ nhận kết nối từ dải IP Cloudflare (ARCHITECTURE §7). Cài vào /etc/nginx/snippets/tami-cloudflare-ips.conf,
# được `include` trong server block của TAMI (tami.conf, tami-staging.conf). KHÔNG đặt ở http{} (sẽ chặn site khác trên server dùng chung).
# Nguồn: https://www.cloudflare.com/ips-v4 và /ips-v6 (lấy 17/10/2026). Cloudflare đổi dải hiếm khi; rà lại mỗi quý.
#
# Vì sao allow/deny mà KHÔNG dùng `real_ip_header CF-Connecting-IP` + `set_real_ip_from`: module realip ghi đè $remote_addr
# (thành IP khách) ở pha post-read, TRƯỚC pha access, nên `allow`/`deny` sẽ so sánh IP khách với dải Cloudflare và chặn nhầm tất cả.
# Ở đây $remote_addr giữ nguyên là IP edge Cloudflare (đã được allow/deny xác thực), còn IP khách do app đọc từ header
# CF-Connecting-IP (TRUST_CF_CONNECTING_IP=true) và log nginx ghi $http_cf_connecting_ip (xem log_format trong tami*.conf).
#
# Cân nhắc thêm: Cloudflare Authenticated Origin Pulls (mTLS), vì dải IP Cloudflare dùng chung cho mọi khách hàng của Cloudflare
# (ai cũng có thể trỏ domain của họ tới origin này). Xem khối ssl_client_certificate đang comment trong tami*.conf.

