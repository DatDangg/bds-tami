# Production KHÔNG Cloudflare (domain trỏ DNS A thẳng về server) — site cổng 80: thử thách ACME HTTP-01 của certbot + chuyển hướng sang HTTPS.
# Cài thành /etc/nginx/sites-available/tami-prod-direct-http.conf + symlink sites-enabled/ (runbook deploy §10).
# Chỉ khớp đúng server_name này (KHÔNG default_server; site default đã giữ cổng 80) nên không ảnh hưởng site khác trên host dùng chung. KHÔNG sửa file của site khác.
# Thư mục webroot dùng chung với staging: /var/www/certbot (đã có).

server {
    listen 80;
    listen [::]:80;
    server_name tami.genieplatform.cloud;

    # Không ghi access log: chỉ ACME + chuyển hướng (và tránh phụ thuộc log_format định nghĩa ở file 443).
    access_log off;
    error_log  /var/log/nginx/tami.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
