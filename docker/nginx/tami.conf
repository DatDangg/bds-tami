# Production — site nginx cho TAMI trên host dùng chung. Cài thành /etc/nginx/sites-available/tami.conf + symlink sites-enabled/.
# Quy trình: sửa REPLACE_WITH_* -> `nginx -t` -> `nginx -s reload`. KHÔNG sửa file của site khác.
# Cần có trước: snippets/tami-cloudflare-ips.conf, chứng chỉ origin Cloudflare (Full strict).

# Log kèm IP khách thật (từ Cloudflare) vì $remote_addr là IP edge Cloudflare. Không log query string (có thể chứa PII).
log_format tami '$http_cf_connecting_ip $remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent" rt=$request_time';

upstream tami_app {
    server 127.0.0.1:3010;
    keepalive 16;
}

# Không mở cổng 80: Cloudflare Full (strict) kết nối HTTPS tới origin, chuyển HTTP->HTTPS đặt ở Cloudflare (Always Use HTTPS).
# (Không thể gate cổng 80 bằng allow/deny khi chỉ có `return 301`: return chạy ở pha rewrite, trước pha access.)

server {
    # `http2` trong listen chạy được trên mọi bản nginx (Ubuntu 22.04 = 1.18, 24.04 = 1.24); `http2 on;` cần >= 1.25.1.
    # Bản >= 1.25.1 chỉ cảnh báo "deprecated" (không lỗi); khi host lên bản mới có thể đổi sang `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name REPLACE_WITH_PRODUCTION_DOMAIN;

    access_log /var/log/nginx/tami.access.log tami;
    error_log  /var/log/nginx/tami.error.log warn;

    ssl_certificate     /etc/ssl/tami/origin.pem;
    ssl_certificate_key /etc/ssl/tami/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Authenticated Origin Pulls (mTLS) — bật khi user duyệt; tải CA từ Cloudflare về /etc/ssl/tami/cloudflare-origin-pull-ca.pem:
    # ssl_client_certificate /etc/ssl/tami/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    include snippets/tami-cloudflare-ips.conf;

    # Header bảo mật mức host. Hai khối location bên dưới KHÔNG dùng add_header để các header này (và Cache-Control của app) được giữ nguyên.
    # CSP do app quản lý (chưa cấu hình ở task này).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload tối đa 20MB (src/lib/upload/validate-file.ts) + phần multipart.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Giữ nguyên IP khách do Cloudflare đặt. Chỉ tới được đây khi peer là IP Cloudflare (allow/deny ở trên); Cloudflare luôn ghi đè header này.
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 60s;

    # Prometheus scrape thẳng 127.0.0.1:3010 (kèm Bearer METRICS_TOKEN), không public.
    location = /api/metrics {
        return 404;
    }

    # Route nội bộ cho job làm mới cache (INTERNAL_APP_URL trong mạng Docker, Bearer dẫn xuất từ PAYLOAD_SECRET), không public.
    location ^~ /api/internal/ {
        return 404;
    }

    # Ngoại lệ cache duy nhất của /api (G1, phương án a): ảnh media. App trả
    # `Cache-Control: public, max-age=31536000, immutable`; nginx KHÔNG strip/ghi đè header, KHÔNG tự cache (proxy_cache off).
    location ^~ /api/media/file/ {
        proxy_cache off;
        proxy_pass http://tami_app;
    }

    # Admin + API: không cache ở nginx; Cache-Control do app quyết định (no-store, riêng /api/monitoring-config là private).
    location ^~ /admin {
        proxy_cache off;
        proxy_pass http://tami_app;
    }
    location ^~ /api/ {
        proxy_cache off;
        proxy_pass http://tami_app;
    }

    location / {
        proxy_cache off;
        proxy_pass http://tami_app;
    }
}
