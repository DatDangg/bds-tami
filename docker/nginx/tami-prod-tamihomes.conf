# Production mới: https://tamihomes.vn (server 179.197.242.57, KHÔNG Cloudflare/CDN/Tunnel) — site cổng 443 của TAMI, cùng host với staging (sslip) và outfitai.
# Cài thành /etc/nginx/sites-available/tami-prod-tamihomes.conf + symlink sites-enabled/ SAU khi certbot đã cấp chứng chỉ và app prod đã chạy
# (docs/runbooks/deploy.md §12). Quy trình: nginx -t -> systemctl reload nginx (KHÔNG restart). KHÔNG sửa file của site khác.
# Dựa trên tami-prod-direct.conf (prod cũ) + tami-staging-sslip-179.conf (host mới nginx >= 1.25.1). Khác prod cũ: server_name/cert, `http2 on;`, server www riêng, tên log_format/upstream.
# Không dùng `include snippets/tami-cloudflare-ips.conf`: không có Cloudflare, $remote_addr đã là IP khách thật.
# Chứng chỉ Let's Encrypt (certbot --webroot, --cert-name tamihomes.vn, SAN tamihomes.vn + www.tamihomes.vn) tại /etc/letsencrypt/live/tamihomes.vn/;
# certbot.timer tự gia hạn; hook reload dùng chung /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh (deploy.md §11.3).
# `app` env phải có TRUST_CF_CONNECTING_IP=false + TRUST_X_REAL_IP=true (đặt trong /opt/tami/prod.env, compose prod bắt buộc khai).
# Không X-Robots-Tag: production được lập chỉ mục.

# Log kèm IP khách thật ($remote_addr). Không log query string (có thể chứa PII).
# Tên khác `tami_staging`: nginx báo lỗi nếu 2 file trên cùng host định nghĩa trùng tên log_format.
log_format tami_prod '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent" rt=$request_time';

upstream tami_prod_app {
    server 127.0.0.1:3010;
    keepalive 16;
}

# www -> apex (cùng cert vì SAN gồm www).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tamihomes.vn;

    access_log off;
    error_log  /var/log/nginx/tami-prod.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/tamihomes.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamihomes.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://tamihomes.vn$request_uri;
}

server {
    # Host mới nginx >= 1.25.1: `http2 on;` là directive riêng từng server nên không ảnh hưởng site khác.
    # Không `default_server`: hostname/IP lạ do tami-default-reject.conf.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tamihomes.vn;

    access_log /var/log/nginx/tami-prod.access.log tami_prod;
    error_log  /var/log/nginx/tami-prod.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/tamihomes.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamihomes.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Header bảo mật mức host. Các location bên dưới KHÔNG dùng add_header để các header này (và Cache-Control của app) được giữ nguyên.
    # HSTS 1 năm, cố ý KHÔNG includeSubDomains/preload (subdomain khác của tamihomes.vn chưa kiểm soát hết).
    # CSP do app quản lý (chưa cấu hình ở task này).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload tối đa 20MB (src/lib/upload/validate-file.ts) + phần multipart.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # IP khách cho rate limit: app (TRUST_X_REAL_IP=true) chỉ đọc X-Real-IP. Nginx LUÔN ghi đè bằng $remote_addr (giá trị client gửi bị bỏ);
    # app chỉ tới được qua 127.0.0.1:3010 nên không ai bỏ qua Nginx để tự đặt header này.
    proxy_set_header X-Real-IP $remote_addr;
    # Không có Cloudflare: xoá CF-Connecting-IP do client gửi (app đặt TRUST_CF_CONNECTING_IP=false nên cũng không tin, đây là lớp thứ hai).
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 60s;

    # Prometheus scrape thẳng 127.0.0.1:3010 (kèm Bearer METRICS_TOKEN), không public.
    location = /api/metrics {
        return 404;
    }

    # Route nội bộ cho job làm mới cache (INTERNAL_APP_URL trong mạng Docker, Bearer dẫn xuất từ PAYLOAD_SECRET), không public.
    location ^~ /api/internal/ {
        return 404;
    }

    # Ảnh media: giữ nguyên `Cache-Control: public, max-age=31536000, immutable` của app (không strip/ghi đè, không proxy_cache).
    location ^~ /api/media/file/ {
        proxy_cache off;
        proxy_pass http://tami_prod_app;
    }

    # Admin + API: không cache ở nginx; Cache-Control do app quyết định (no-store, riêng /api/monitoring-config là private).
    location ^~ /admin {
        proxy_cache off;
        proxy_pass http://tami_prod_app;
    }
    location ^~ /api/ {
        proxy_cache off;
        proxy_pass http://tami_prod_app;
    }

    location / {
        proxy_cache off;
        proxy_pass http://tami_prod_app;
    }
}
