# Staging mới: 179-197-242-57.sslip.io (server 179.197.242.57, KHÔNG Cloudflare/Tunnel) — site cổng 80: thử thách ACME HTTP-01 của certbot + chuyển hướng sang HTTPS.
# Cài thành /etc/nginx/sites-available/tami-staging-sslip-179-http.conf + symlink sites-enabled/ TRƯỚC khi xin chứng chỉ
# (file 443 `tami-staging-sslip-179.conf` chỉ cài SAU khi certbot đã cấp chứng chỉ, vì nginx -t lỗi nếu thiếu file cert).
# Chỉ khớp đúng server_name này (KHÔNG default_server; site `default` của gói nginx giữ cổng 80). Quy trình: docs/runbooks/deploy.md §11.
# Thư mục webroot: sudo install -d -o root -g root -m 755 /var/www/certbot

server {
    listen 80;
    listen [::]:80;
    server_name 179-197-242-57.sslip.io;

    # Không ghi access log: chỉ ACME + chuyển hướng (và tránh phụ thuộc log_format định nghĩa ở file 443).
    access_log off;
    error_log  /var/log/nginx/tami-staging.error.log warn;

    # Không basic auth ở đây: certbot (Let's Encrypt) phải đọc được thử thách.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
