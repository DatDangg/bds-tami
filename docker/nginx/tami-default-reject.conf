# Staging mới (179.197.242.57): chặn truy cập HTTPS bằng IP / hostname lạ để KHÔNG rơi vào vhost staging.
# Cài thành /etc/nginx/sites-available/tami-default-reject.conf + symlink sites-enabled/. Chỉ dùng trên host staging mới (nginx 443 dùng chung với site `outfitai.genieplatform.cloud`: file này là default_server toàn host nên client không SNI/IP trần tới outfitai cũng bị từ chối handshake, tác động nhỏ) — KHÔNG cài lên server cũ 187.52.119.50 (nhiều site khác dùng chung 443, đã có default_server riêng).
# `ssl_reject_handshake on` (nginx ≥ 1.19.4): đóng TLS handshake, không cần chứng chỉ. Cổng 80 giữ site `default` của gói nginx.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
