name: Deploy

# CD (ARCHITECTURE §6.4, .context/decisions.md Decision 4): runner GitHub build image tag = commit SHA -> GHCR -> SSH vào server chạy
# scripts/deploy/deploy.sh.  build -> staging (tự động) -> production (GitHub Environment `production`, required reviewers,
# CÙNG digest đã chạy ở staging).
# Chỉ chạy sau khi workflow CI PASS cho một lần PUSH vào nhánh `staging` của chính repo này. Không có trigger nào từ `main`,
# từ pull_request hay từ fork. Thiết lập trên GitHub (secret, Environment, reviewer): docs/runbooks/deploy.md.
#
# Lưu ý `workflow_run`: GitHub chỉ đọc file này từ NHÁNH MẶC ĐỊNH của repo => nhánh mặc định phải là `staging` (xem runbook).
#
# Action pin theo commit SHA đầy đủ (kèm comment version); SHA tra bằng `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>`.
# Dependabot (github-actions, .github/dependabot.yml) đề xuất cập nhật SHA khi có bản mới.
# Mã triển khai upload vào release bất biến /opt/tami/releases/<env>/<sha>; deploy.sh chạy từ chính release đó (runbook §3.1).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]

permissions:
  contents: read

env:
  TAMI_DEPLOY_ROOT: /opt/tami

jobs:
  build:
    name: Build image + push GHCR
    # Chỉ khi CI xanh, là push (không phải pull_request), đúng nhánh staging và head là repo này (không fork).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'staging' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Tên image (GHCR bắt buộc chữ thường)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag = commit SHA (không `latest`); nơi deploy dùng DIGEST, tag chỉ để tra cứu.
      # provenance: false => manifest đơn, digest output là digest của chính image sẽ pull.
      - name: Build + push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          # Source map trình duyệt -> GlitchTip (tuỳ chọn): thiếu secret/vars thì build bình thường, không sinh source map.
          secrets: |
            glitchtip_auth_token=${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          build-args: |
            NEXT_PUBLIC_HOTLINE=${{ vars.NEXT_PUBLIC_HOTLINE }}
            GLITCHTIP_URL=${{ vars.GLITCHTIP_URL }}
            GLITCHTIP_ORG=${{ vars.GLITCHTIP_ORG }}
            GLITCHTIP_PROJECT=${{ vars.GLITCHTIP_PROJECT }}
          tags: ${{ steps.name.outputs.image }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.title=tami-web
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Kiểm tra digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: '[[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "digest không hợp lệ"; exit 1; }'

  deploy-staging:
    name: Deploy staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    # Hàng đợi riêng cho staging; không huỷ deploy đang chạy giữa chừng.
    concurrency:
      group: tami-deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: ./.github/actions/ssh-deploy
        with:
          environment: staging
          image: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          registry-user: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-root: ${{ env.TAMI_DEPLOY_ROOT }}
          release-sha: ${{ github.event.workflow_run.head_sha }}

      # Chỉ chạy khi bước deploy ở trên thành công: đây là digest production được phép nhận.
      - name: Ghi digest đã qua staging
        id: record
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy production (cần duyệt)
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Required reviewers cấu hình trên GitHub Environment `production`: job dừng ở trạng thái waiting đến khi được duyệt.
    environment: production
    concurrency:
      group: tami-deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Không build lại, không tag lại: dùng đúng digest staging đã chạy (output của deploy-staging).
      # deploy.sh trên server còn tự kiểm digest này có trong staging.history.
      - uses: ./.github/actions/ssh-deploy
        with:
          environment: production
          image: ${{ needs.build.outputs.image }}@${{ needs.deploy-staging.outputs.digest }}
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          registry-user: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-root: ${{ env.TAMI_DEPLOY_ROOT }}
          release-sha: ${{ github.event.workflow_run.head_sha }}
