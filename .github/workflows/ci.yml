name: CI

# Chỉ kiểm tra (lint, typecheck, test, build, audit). KHÔNG deploy/push — CD là task riêng (ARCHITECTURE §6.4).
on:
  push:
    branches: [staging]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres KHÔNG nằm trong `services:`: DB test phải là CÙNG image với dev/staging/prod (docker/backup/Dockerfile target `postgis`,
    # base postgres:17.11-bookworm ghim digest + PostGIS 3.5.2, glibc 2.36) mà `services:` chỉ kéo image có sẵn trên registry, không build
    # được trong job → build + `docker run` ở bước "Build + khởi động Postgres" bên dưới (cùng kiểu SeaweedFS).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Toàn bộ giá trị là dummy cho CI, KHÔNG phải secret thật. `src/payload.config.ts` gọi getEnv() khi import
    # nên `pnpm build` cần đủ biến bắt buộc (.context/project-config.md § Secrets).
    env:
      DATABASE_URL: postgres://tami:ci_only_password@127.0.0.1:5432/tami_test
      DATABASE_URL_TEST: postgres://tami:ci_only_password@127.0.0.1:5432/tami_test
      PAYLOAD_SECRET: ci-dummy-payload-secret-not-a-real-secret
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_ACCESS_KEY_ID: ci-dummy-access
      S3_SECRET_ACCESS_KEY: ci-dummy-secret
      S3_BUCKET_PUBLIC: public
      S3_BUCKET_PRIVATE: private
      TURNSTILE_SITE_KEY: ci-dummy-site-key
      TURNSTILE_SECRET_KEY: ci-dummy-turnstile-secret
      SMTP_HOST: smtp.invalid
      SMTP_USER: ci-dummy-user
      SMTP_PASS: ci-dummy-pass
      ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      TRANSLATION_MODEL: ci-dummy-model
      TRANSLATION_MONTHLY_BUDGET_USD: "0"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Không publish lên GHCR (image dùng-rồi-bỏ; job chỉ có `contents: read`), không thêm action cache: chấp nhận build không cache (~1–2 phút apt).
      # Dockerfile đã assert bookworm/glibc 2.36 lúc build; phiên bản PG/PostGIS kiểm ở bước "Kiểm phiên bản DB test" sau khi có extension.
      - name: Build + khởi động Postgres (cùng image dev/staging/prod)
        run: |
          docker build --target postgis -t tami-postgis:ci docker/backup
          docker run -d --name tami-ci-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=tami -e POSTGRES_PASSWORD=ci_only_password -e POSTGRES_DB=tami_test \
            tami-postgis:ci
          # Entrypoint official chạy server tạm (chỉ socket, không TCP) lúc initdb rồi khởi động lại: chờ bằng kết nối TCP từ host
          # (psql có sẵn trên ubuntu-latest), không chỉ pg_isready trong container.
          for i in $(seq 1 60); do
            psql "$DATABASE_URL_TEST" -Atc 'select 1' >/dev/null 2>&1 && break
            sleep 2
          done
          psql "$DATABASE_URL_TEST" -v ON_ERROR_STOP=1 -Atc 'select 1' >/dev/null

      # Phiên bản pnpm lấy từ field `packageManager` trong package.json.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Cài đặt (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Cùng script khởi tạo với Docker dev: postgis, unaccent, pg_trgm (psql có sẵn trên ubuntu-latest).
      - name: Tạo extension Postgres
        run: psql "$DATABASE_URL_TEST" -v ON_ERROR_STOP=1 -f docker/postgres/init.sql

      # Fail-fast nếu DB test trôi về image khác: phiên bản mong đợi đọc từ ARG của Dockerfile (nguồn duy nhất), không lặp hằng số ở đây.
      - name: Kiểm phiên bản DB test khớp Dockerfile
        run: |
          pg_expected="$(sed -nE 's/^ARG POSTGRES_IMAGE=postgres:([0-9]+\.[0-9]+)-.*/\1/p' docker/backup/Dockerfile)"
          postgis_expected="$(sed -nE 's/^ARG POSTGIS_VERSION=([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/p' docker/backup/Dockerfile)"
          test -n "$pg_expected" && test -n "$postgis_expected"
          pg_actual="$(psql "$DATABASE_URL_TEST" -Atc "select split_part(current_setting('server_version'), ' ', 1)")"
          postgis_actual="$(psql "$DATABASE_URL_TEST" -Atc 'select postgis_lib_version()')"
          docker exec tami-ci-postgres sh -c 'grep VERSION_CODENAME /etc/os-release; ldd --version | head -n1'
          echo "postgres=$pg_actual (Dockerfile $pg_expected) postgis=$postgis_actual (Dockerfile $postgis_expected)"
          [ "$pg_actual" = "$pg_expected" ] || { echo "PostgreSQL lệch Dockerfile"; exit 1; }
          [ "$postgis_actual" = "$postgis_expected" ] || { echo "PostGIS lệch Dockerfile"; exit 1; }

      # G21: chạy TOÀN BỘ migration đã commit trên một DB PostGIS TRỐNG (DB riêng `tami_migrate`, không đụng `tami_test` của test)
      # để lỗi migration lộ ở CI thay vì lần deploy staging/prod đầu. Thành công = migration tạo schema từ số 0 mà không lỗi.
      - name: Migrate toàn bộ trên DB trống
        env:
          DATABASE_URL: postgres://tami:ci_only_password@127.0.0.1:5432/tami_migrate
        run: |
          psql "$DATABASE_URL_TEST" -v ON_ERROR_STOP=1 -c "CREATE DATABASE tami_migrate"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
          pnpm payload migrate

      # Test integration nạp `src/payload.config.ts` với DATABASE_URL (= tami_test) nên DB này phải có schema thật.
      # Test tự tạo DB tạm (DATABASE_URL_TEST làm base) dùng tên DB khác nên không đụng tami_test.
      - name: Migrate DB test (tami_test)
        run: pnpm payload migrate

      # Integration test cần S3 thật (media / private-file / job-applications / health). GitHub `services:` không truyền được command
      # nên chạy bằng `docker run`, cùng image + lệnh `server -s3` như docker/docker-compose.dev.yml; identity là key dummy khớp env S3_*.
      - name: Khởi động SeaweedFS S3 + tạo bucket
        run: |
          cat > "$RUNNER_TEMP/s3.json" <<'JSON'
          {"identities":[{"name":"ci","credentials":[{"accessKey":"ci-dummy-access","secretKey":"ci-dummy-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name tami-ci-seaweedfs -p 127.0.0.1:8333:8333 \
            -v "$RUNNER_TEMP/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256 -volume.max=32
          # Runner đĩa nhỏ: mặc định volumeSizeLimit 30GB + volume.max tự tính theo đĩa trống => chỉ đủ volume cho 1 collection
          # (bucket thứ hai ghi lỗi InternalError). Giới hạn nhỏ để mỗi bucket (collection) có volume riêng.
          for i in $(seq 1 60); do
            docker exec tami-ci-seaweedfs wget -q -O /dev/null http://127.0.0.1:9333/cluster/status \
              && curl -s -m 3 http://127.0.0.1:8333/ >/dev/null && break
            sleep 2
          done
          docker exec tami-ci-seaweedfs wget -q -O /dev/null http://127.0.0.1:9333/cluster/status
          curl -s -m 3 http://127.0.0.1:8333/ >/dev/null
          for bucket in public private; do
            echo "s3.bucket.create -name $bucket" | docker exec -i tami-ci-seaweedfs weed shell -master=127.0.0.1:9333
          done
          # weed shell thường exit 0 kể cả khi lệnh lỗi: kiểm danh sách bucket thật.
          buckets="$(echo "s3.bucket.list" | docker exec -i tami-ci-seaweedfs weed shell -master=127.0.0.1:9333)"
          echo "$buckets"
          for bucket in public private; do echo "$buckets" | grep -qw "$bucket" || { echo "thiếu bucket $bucket"; exit 1; }; done

      # G18: importMap.js sinh tay bị lệch đã từng gây lỗi thật (a614b3d). Sinh lại rồi so với bản đã commit.
      - name: importMap không lệch
        run: |
          pnpm payload generate:importmap
          git diff --exit-code -- "src/app/(payload)/admin/importMap.js"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + integration)
        run: pnpm test

      - name: Log Postgres khi lỗi
        if: failure()
        run: docker logs --tail 200 tami-ci-postgres || true

      - name: Log SeaweedFS khi test lỗi
        if: failure()
        run: |
          docker logs --tail 200 tami-ci-seaweedfs || true
          echo "volume.list" | docker exec -i tami-ci-seaweedfs weed shell -master=127.0.0.1:9333 || true

      - name: Build
        run: pnpm build

      # Allowlist advisory nằm ở package.json -> pnpm.auditConfig.ignoreGhsas:
      #   GHSA-vfj7-8cjw-p6xm (braces@3.0.3, high, ReDoS/stack exhaustion): transitive qua sass > chokidar,
      #   chỉ build-time, chưa có bản vá. Xem lại trước 2026-12-16 (hoặc khi có bản vá) rồi gỡ khỏi allowlist.
      - name: Audit phụ thuộc
        run: pnpm audit --audit-level high
